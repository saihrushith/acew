                {faqsData.map((faq, idx) => {
                  const isOpen = activeFaqIndex === idx;
                  return (
                    <div key={idx} className={`faq-item ${isOpen ? "active" : ""}`}>
                      <button 
                        className="faq-question"
                        onClick={() => setActiveFaqIndex(isOpen ? -1 : idx)}
                      >
                        <span>{faq.q}</span>
                        <span className="faq-icon">{isOpen ? "−" : "+"}</span>
                      </button>
                      <div className="faq-answer">
                        <p>{faq.a}</p>
                      </div>
                    </div>
                  );
                })}

                    <div className="checklist-item"><i className="fa-solid fa-check check-orange"></i> Zero Fees for Job Seekers</div>

                      <i className="fa-brands fa-whatsapp"></i> Submit Your Profile &rarr;

          <section className="manifesto-section">

              <div style={{ maxWidth: "900px", margin: "0 auto" }}>

          {/* ==========================================

          {/* ==========================================
               MODALS (WITH DIRECT WHATSAPP REDIRECT)
               ========================================== */}
          
          {/* Employer Hiring Requirement Modal */}
          <div className={`modal-overlay ${showEmployerModal ? "active" : ""}`}>
            <div className="modal-container">
              <button className="modal-close" onClick={() => setShowEmployerModal(false)}>&times;</button>
              <span className="section-tag blue" style={{ marginBottom: "0.5rem" }}>
                <i className="fa-brands fa-whatsapp"></i> WhatsApp Direct Sourcing
              </span>
              <h2 style={{ fontSize: "1.8rem", marginBottom: "0.5rem" }}>Submit Your Hiring Requirement</h2>
              <p style={{ fontSize: "0.92rem", marginBottom: "1.5rem" }}>
                Fill in your position requirements below. Upon submission, this information will be forwarded instantly to our recruitment team on WhatsApp.
              </p>

              <form onSubmit={handleEmployerSubmit}>
                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="empName">Your Name / Designation *</label>
                    <input type="text" id="empName" name="empName" className="form-control" placeholder="e.g. HR Manager / Plant Head" required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="empCompany">Company Name *</label>
                    <input type="text" id="empCompany" name="empCompany" className="form-control" placeholder="e.g. Hyderabad Auto Components Ltd" required />
                  </div>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="empEmail">Business Email *</label>
                    <input type="email" id="empEmail" name="empEmail" className="form-control" placeholder="name@company.com" required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="empPhone">Phone / WhatsApp Number *</label>
                    <input type="tel" id="empPhone" name="empPhone" className="form-control" placeholder="+91 98765 43210" required />
                  </div>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="empRole">Role Category *</label>
                    <select id="empRole" name="empRole" className="form-control" required>
                      <option value="">Select Role Specialisation</option>
                      <option value="CNC & Precision Machining">CNC &amp; Precision Machining (VMC/HMC/Lathe)</option>
                      <option value="Maintenance & Electrical">Maintenance &amp; Electrical Technicians</option>
                      <option value="Welding & Fabrication">Welding &amp; Fabrication (TIG/MIG/Arc)</option>
                      <option value="Production & Assembly">Production &amp; Assembly Operators</option>
                      <option value="Quality & Inspection">Quality &amp; QC / CMM / NDT Inspection</option>
                      <option value="Warehouse & Logistics">Warehouse &amp; Logistics / Forklift</option>
                      <option value="Engineering & Technical">Engineering &amp; Technical (Mechanical/Electrical/Civil)</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label htmlFor="empCount">Number of Positions *</label>
                    <input type="number" id="empCount" name="empCount" className="form-control" placeholder="e.g. 4" min="1" required />
                  </div>
                </div>

                <div className="form-group">
                  <label htmlFor="empDetails">Role Details, Machine Controls, Experience &amp; Timeline *</label>
                  <textarea 
                    id="empDetails" 
                    name="empDetails" 
                    rows="3" 
                    className="form-control" 
                    placeholder="Specify controls (Fanuc, Siemens, Haas), welding grade (TIG/MIG), years of experience, shift requirements, and joining timeline." 
                    required
                  ></textarea>
                </div>

                <button type="submit" className="btn btn-orange" style={{ width: "100%", marginTop: "0.5rem" }}>
                  <i className="fa-brands fa-whatsapp"></i> Send Requirement to WhatsApp &rarr;
                </button>
              </form>
            </div>
          </div>

          {/* Candidate Profile Submission Modal */}
          <div className={`modal-overlay ${showCandidateModal ? "active" : ""}`}>
            <div className="modal-container">
              <button className="modal-close" onClick={() => setShowCandidateModal(false)}>&times;</button>
              <span className="section-tag blue" style={{ marginBottom: "0.5rem" }}>
                <i className="fa-brands fa-whatsapp"></i> Direct Candidate Registration
              </span>
              <h2 style={{ fontSize: "1.8rem", marginBottom: "0.5rem" }}>Submit Your Profile</h2>
              <p style={{ fontSize: "0.92rem", marginBottom: "1.5rem" }}>
                Looking for industrial opportunities in Hyderabad? Fill your details below to send directly to our recruitment helpline on WhatsApp.
              </p>

              <form onSubmit={handleCandidateSubmit}>
                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="candName">Full Name *</label>
                    <input type="text" id="candName" name="candName" className="form-control" placeholder="Your Full Name" required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="candPhone">Phone / WhatsApp Number *</label>
                    <input type="tel" id="candPhone" name="candPhone" className="form-control" placeholder="+91 98765 43210" required />
                  </div>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="candRole">Your Primary Skill / Role *</label>
                    <input type="text" id="candRole" name="candRole" className="form-control" placeholder="e.g. CNC Operator / TIG Welder / QC Inspector" required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="candExp">Total Experience (Years) *</label>
                    <input type="number" id="candExp" name="candExp" className="form-control" placeholder="e.g. 4" min="0" required />
                  </div>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label htmlFor="candCity">Current City *</label>
                    <input type="text" id="candCity" name="candCity" className="form-control" placeholder="e.g. Pune, Chennai, Hyderabad, Coimbatore" required />
                  </div>
                  <div className="form-group">
                    <label htmlFor="candRelocate">Willing to work in Hyderabad? *</label>
                    <select id="candRelocate" name="candRelocate" className="form-control" required>
                      <option value="Yes, ready to relocate">Yes, ready to relocate to Hyderabad</option>
                      <option value="Already located in Hyderabad">Already located in Hyderabad</option>
                    </select>
                  </div>
                </div>

                <div className="form-group">
                  <label htmlFor="candNote">Key Machines Handled / Certifications / Notice Period</label>
                  <textarea 
                    id="candNote" 
                    name="candNote" 
                    rows="2" 
                    className="form-control" 
                    placeholder="Mention machines (Fanuc/Siemens VMC), welding certs (6G/TIG), current salary, notice period."
                  ></textarea>
                </div>

                <button type="submit" className="btn btn-orange" style={{ width: "100%", marginTop: "0.5rem" }}>
                  <i className="fa-brands fa-whatsapp"></i> Send Profile to WhatsApp &rarr;
                </button>
              </form>
            </div>
          </div>

          {/* Toast Notification */}
          <div 
            style={{
              position: "fixed",
              bottom: "25px",
              right: "25px",
              background: "#0b2f5c",
              color: "#fff",
              padding: "1rem 1.5rem",
              borderRadius: "12px",
              boxShadow: "0 10px 30px rgba(0,0,0,0.3)",
              borderLeft: "5px solid #ff7700",
              zIndex: 10000,
              transform: toast.show ? "translateY(0)" : "translateY(150%)",
              transition: "transform 0.4s ease",
              maxWidth: "350px"
            }}
          >
            <h4 style={{ color: "#ff7700", fontSize: "1rem", marginBottom: "0.25rem" }}>{toast.title}</h4>
            <p style={{ fontSize: "0.88rem", color: "#e2e8f0", margin: 0 }}>{toast.message}</p>
          </div>
        </div>
      );
    }

    // Render React Application
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
